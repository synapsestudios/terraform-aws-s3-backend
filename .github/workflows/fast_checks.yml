name: "Fast Checks"
on:
  workflow_call:

permissions:
  contents: read

jobs:
  fast_checks:
    name: "Fast Checks"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install lintofu
        run: npm ci

      - name: lintofu
        run: npm run lint
